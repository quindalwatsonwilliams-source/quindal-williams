<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F7F3EF;font-family:"Space Mono",ui-monospace,monospace;color:#1A1A2E;padding:20px 24px;}
.lbl{font-size:11px;color:#8a8a9c;letter-spacing:.02em;margin-top:8px}
.swrow{display:flex;gap:12px}
.swrow > div{flex:1}
.chip{height:84px;border-radius:12px}
</style></head><body>
<div class="swrow">
 <div><div class="chip" style="background:#F7F3EF;border:2px solid #1A1A2E"></div><div class="lbl">cream · #F7F3EF</div></div>
 <div><div class="chip" style="background:#1A1A2E"></div><div class="lbl">ink · #1A1A2E</div></div>
 <div><div class="chip" style="background:#000000"></div><div class="lbl">black · #000000</div></div>
 <div><div class="chip" style="background:#B2010C"></div><div class="lbl">crimson · #B2010C</div></div>
</div></body></html>
