<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@500&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:#F7F3EF;color:#1A1A2E;padding:26px 30px;font-family:"Space Mono",monospace}
.meta{font-size:11px;color:#8a8a9c;margin-top:20px;letter-spacing:.02em}
.row{display:flex;gap:34px;align-items:center;flex-wrap:wrap}
.glyphbig{font-family:"Cormorant Garamond",serif;font-size:62px;line-height:1}
.aster{font-family:"Cormorant Garamond",serif;font-size:64px;line-height:1;color:#447A5F}
.est{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:12px;letter-spacing:.26em;white-space:nowrap;color:#1A1A2E;border:1.5px solid #1A1A2E;border-radius:999px;padding:11px 18px 11px 22px;text-transform:uppercase}
.spark{position:relative;width:74px;height:74px}
.spark span{position:absolute;font-family:"Cormorant Garamond",serif}
.spark .a{font-size:40px;top:14px;left:8px;color:#1A1A2E}
.spark .b{font-size:22px;top:4px;left:44px;color:#B2010C}
.spark .c{font-size:17px;top:44px;left:46px;color:#832D51}
</style></head><body>
<div class="row">
 <div class="glyphbig" style="color:#B2010C">✶</div>
 <div class="aster">✻</div>
 <div class="est">Est. MMXXVI</div>
 <div class="spark"><span class="a">✦</span><span class="b">✦</span><span class="c">✦</span></div>
</div>
<div class="meta">EMBLEMS · high-contrast serif glyphs · tracked est. mark · refined sparkles</div>
</body></html>
