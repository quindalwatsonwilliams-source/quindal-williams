<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--fg1);padding:24px 28px;font-family:var(--font-sans)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:16px;letter-spacing:.02em}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.field label{display:block;font-family:var(--font-sans);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);margin-bottom:7px}
.field input{width:100%;font-family:var(--font-sans);font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:13px 16px;outline:none}
.field input::placeholder{color:var(--fg3)}
.field .foc{border-color:var(--crimson-500);box-shadow:0 0 0 4px rgba(178,1,12,.12)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:600px">
 <div class="field"><label>Your name</label><input placeholder="Quindal Williams"></div>
 <div class="field"><label>Email</label><input class="foc" value="hi@quindal" ></div>
</div>
<div class="meta">FORM FIELD · ink 2px outline · crimson focus ring · 14px radius · default + focused</div></body></html>
