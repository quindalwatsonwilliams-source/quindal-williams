<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:#F7F3EF;color:#1A1A2E;padding:22px 26px;font-family:"Space Mono",ui-monospace,monospace}
.lbl{font-size:11px;color:#8a8a9c;letter-spacing:.02em;margin-top:10px}
.ramp{display:flex;gap:0;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(26,26,46,.08)}
.sw{flex:1;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:11px;line-height:1.35}
.sw b{font-weight:700;font-size:12px}
</style></head><body>
<div class="ramp">
 <div class="sw" style="background:#0D1F30;color:#fff"><b>900</b>#0D1F30</div>
 <div class="sw" style="background:#225281;color:#fff"><b>700</b>#225281</div>
 <div class="sw" style="background:#8EB8E1;color:#1A1A2E"><b>500</b>#8EB8E1</div>
 <div class="sw" style="background:#B6CCE7;color:#1A1A2E"><b>300</b>#B6CCE7</div>
 <div class="sw" style="background:#EAF1F8;color:#1A1A2E"><b>100</b>#EAF1F8</div>
</div>
<div class="lbl">AZURE &nbsp;·&nbsp; 900 → 100 &nbsp;·&nbsp; 500 = true brand hue</div>
</body></html>
