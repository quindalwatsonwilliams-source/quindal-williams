<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:#F7F3EF;color:#1A1A2E;padding:22px 26px;font-family:"Space Mono",ui-monospace,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 30px}
.chip{display:flex;align-items:center;gap:10px;font-size:12px;color:#55556b;padding:7px 0}
.sw{width:26px;height:26px;border-radius:7px;flex:none}
</style></head><body>
<div class="grid">
 <div class="chip"><span class="sw" style="background:#1A1A2E"></span> --fg1 · primary text</div>
 <div class="chip"><span class="sw" style="background:#55556b"></span> --fg2 · secondary</div>
 <div class="chip"><span class="sw" style="background:#8a8a9c"></span> --fg3 · muted</div>
 <div class="chip"><span class="sw" style="background:#B2010C"></span> --accent · crimson</div>
 <div class="chip"><span class="sw" style="background:#E72388"></span> --accent-2 · magenta</div>
 <div class="chip"><span class="sw" style="background:#0E6771"></span> --accent-3 · teal</div>
 <div class="chip"><span class="sw" style="background:#F8BB0B"></span> --highlight · amber</div>
 <div class="chip"><span class="sw" style="background:#E4DCD2;border:1px solid #d8cfc4"></span> --line · hairline</div>
</div></body></html>
