<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

<style>*{box-sizing:border-box}html,body{margin:0}

.row{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--line)}

<div class="row"><span class="tag">eyebrow</span><span style="font-family:var(--font-sans);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)">BUILD YOUR CHARACTER</span></div>
<div class="row"><span class="tag">h3 / display</span><span style="font-family:var(--font-display);font-weight:600;font-size:26px">Selected work</span></div>
