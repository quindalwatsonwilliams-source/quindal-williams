<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--fg1);padding:24px 28px;font-family:var(--font-sans)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:14px;letter-spacing:.02em}
.t{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-top:8px;text-align:center}
.box{display:flex;gap:30px;align-items:center;padding:6px 4px 18px}.s{flex:1;text-align:center}.c{height:78px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--fg3)}</style></head><body>
<div class="box">
 <div class="s"><div class="c" style="box-shadow:var(--shadow-sm)">sm</div><div class="t">soft · ambient</div></div>
 <div class="s"><div class="c" style="box-shadow:var(--shadow-md)">md</div><div class="t">float card</div></div>
 <div class="s"><div class="c" style="box-shadow:var(--shadow-lg)">lg</div><div class="t">modal / hero</div></div>
 <div class="s"><div class="c" style="box-shadow:5px 5px 0 var(--ink);border:2px solid var(--ink)">sticker</div><div class="t">5px ink offset</div></div>
 <div class="s"><div class="c" style="box-shadow:6px 6px 0 var(--crimson-500);border:2px solid var(--ink)">accent</div><div class="t">crimson offset</div></div>
</div>
<div class="meta">ELEVATION · soft warm shadows + hard "sticker" offset (the Y2K pasted-on feel)</div></body></html>
