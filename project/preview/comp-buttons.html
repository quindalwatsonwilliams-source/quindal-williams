<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Space+Grotesk:wght@500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:#F7F3EF;color:#1A1A2E;padding:26px 28px;font-family:"Space Grotesk",sans-serif}
.meta{font-family:"Space Mono",monospace;font-size:11px;color:#8a8a9c;margin-top:22px;letter-spacing:.02em}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:16px;cursor:pointer;background:transparent;
  border:2.5px solid currentColor;border-radius:999px;padding:13px 27px;transition:transform .12s ease, background .12s ease, color .12s ease}
.btn:hover{transform:translateY(-2px)}

.crimson{color:#B2010C}.crimson:hover{background:#B2010C;color:#fff}
.magenta{color:#E72388}.magenta:hover{background:#E72388;color:#fff}
.teal{color:#0E6771}.teal:hover{background:#0E6771;color:#fff}
.azure{color:#225281}.azure:hover{background:#225281;color:#fff}
.amber{color:#9a7400}.amber:hover{background:#F8BB0B;color:#1A1A2E}
.olive{color:#858709}.olive:hover{background:#BFC20A;color:#1A1A2E}
.ink{color:#1A1A2E}.ink:hover{background:#1A1A2E;color:#F7F3EF}

.icon{width:54px;height:54px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  font-size:22px;padding:0}
</style></head><body style="font-family: Fredoka">
<div class="row">
 <button class="btn crimson">Let's talk ✦</button>
 <button class="btn magenta">Build your character</button>
 <button class="btn teal">View work</button>
 <button class="btn amber">Save result</button>
</div>
<div class="row" style="margin-top:16px">
 <button class="btn azure">Say hi →</button>
 <button class="btn olive">Read more</button>
 <button class="btn ink">Get in touch</button>
 <button class="btn icon crimson">→</button>
 <button class="btn icon magenta">✦</button>
 <button class="btn icon teal">★</button>
</div>
<div class="meta">BUTTONS · rounded pills · colored outline + transparent fill · fills with color on hover · bubbly Fredoka · round icon buttons</div></body></html>
