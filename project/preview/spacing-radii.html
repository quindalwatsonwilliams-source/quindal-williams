<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--fg1);padding:24px 28px;font-family:var(--font-sans)}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--fg3);margin-top:14px;letter-spacing:.02em}
.t{font-family:var(--font-mono);font-size:10px;color:var(--fg3);margin-top:8px;text-align:center}
.box{display:flex;gap:22px;align-items:flex-end}.r{flex:1;text-align:center}.r .b{height:74px;background:var(--magenta-300);border:2px solid var(--ink)}</style></head><body>
<div class="box">
 <div class="r"><div class="b" style="border-radius:8px"></div><div class="t">sm · 8</div></div>
 <div class="r"><div class="b" style="border-radius:16px"></div><div class="t">md · 16</div></div>
 <div class="r"><div class="b" style="border-radius:28px"></div><div class="t">lg · 28</div></div>
 <div class="r"><div class="b" style="border-radius:44px"></div><div class="t">xl · 44</div></div>
 <div class="r"><div class="b" style="border-radius:999px"></div><div class="t">pill · 999</div></div>
</div>
<div class="meta">CORNER RADII · soft + friendly · pills for tags & buttons</div></body></html>
