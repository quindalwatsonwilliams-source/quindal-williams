<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}

.sw{flex:1;height:90px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;font-size:11px;line-height:1.35}

<div class="ramp">
 <div class="sw" style="background:#3C0606;color:#fff"><b>900</b>#3C0606</div>

 <div class="sw" style="background:#B2010C;color:#fff"><b>500</b>#B2010C</div>
 <div class="sw" style="background:#C1343D;color:#fff"><b>300</b>#C1343D</div>
 <div class="sw" style="background:#E69593;color:#1A1A2E"><b>100</b>#E69593</div>
</div>
<div class="lbl">CRIMSON · HERO ACCENT &nbsp;·&nbsp; 900 → 100 &nbsp;·&nbsp; 500 = true brand hue</div>
